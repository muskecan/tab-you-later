<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab You Later</title>
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <div class="ob-container">
    <div class="ob-card">
      
      <div class="ob-logo">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <rect x="4" y="4" width="56" height="56" rx="14" fill="var(--ob-accent)" opacity="0.12"/>
          <rect x="12" y="18" width="40" height="32" rx="4" stroke="var(--ob-accent)" stroke-width="2.5"/>
          <rect x="12" y="14" width="40" height="8" rx="4" fill="var(--ob-accent)" opacity="0.25"/>
          <circle cx="18" cy="18" r="2" fill="var(--ob-accent)"/>
          <circle cx="24" cy="18" r="2" fill="var(--ob-accent)"/>
          <circle cx="30" cy="18" r="2" fill="var(--ob-accent)"/>
          <path d="M24 34L30 30V38L24 34Z" fill="var(--ob-accent)" opacity="0.6"/>
          <line x1="34" y1="32" x2="44" y2="32" stroke="var(--ob-accent)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
          <line x1="34" y1="37" x2="40" y2="37" stroke="var(--ob-accent)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
        </svg>
      </div>

      <h1 class="ob-title" data-i18n="onboarding_welcome">Welcome to Tab You Later!</h1>
      <p class="ob-subtitle" data-i18n="onboarding_subtitle">End tab clutter. Save pages and links to read later.</p>

      
      <div class="ob-section">
        <h2 class="ob-section-title" data-i18n="onboarding_question">How would you like to store your data?</h2>

        <label class="ob-option" id="option-local">
          <input type="radio" name="storage" value="local" checked>
          <div class="ob-option-body">
            <div class="ob-option-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/>
                <line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="8" y1="8" x2="16" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="8" y1="16" x2="12" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="ob-option-text">
              <strong data-i18n="onboarding_local_title">This Device Only</strong>
              <span data-i18n="onboarding_local_desc">Data is stored only on this computer.</span>
            </div>
          </div>
        </label>

        <label class="ob-option" id="option-sync">
          <input type="radio" name="storage" value="sync">
          <div class="ob-option-body">
            <div class="ob-option-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M4 12C4 7.6 7.6 4 12 4C14.8 4 17.2 5.4 18.7 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M20 12C20 16.4 16.4 20 12 20C9.2 20 6.8 18.6 5.3 16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <polyline points="16 7.5, 19 7.5, 19 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="8 16.5, 5 16.5, 5 19.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="ob-option-text">
              <strong data-i18n="onboarding_sync_title">Sync with Google Account</strong>
              <span data-i18n="onboarding_sync_desc">Data is synced across all your devices.</span>
            </div>
          </div>
        </label>
      </div>

      <button id="continue-btn" class="ob-btn" data-i18n="onboarding_start">Let's Go</button>
      <p class="ob-note" data-i18n="onboarding_note">You can change this later in Settings.</p>
    </div>
  </div>

  <script src="../i18n/translations.js"></script>
  <script src="../i18n/i18n.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
